version: "3.8"

services:
  # ── PostgreSQL database ──────────────────────────
  db:
    image: postgres:15-alpine
    container_name: snip_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js backend ─────────────────────────────
  backend:
    image: gregzone/snip-backend:latest  
    container_name: snip_backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BASE_URL: ${BASE_URL}
    depends_on:
      db:
        condition: service_healthy
    
  # ── Nginx reverse proxy ─────────────────────────
  nginx:
    image: nginx:alpine
    container_name: snip_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
