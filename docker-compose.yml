services:
  # ── PostgreSQL database ──────────────────────────
  db:
    image: postgres:15-alpine
    container_name: snip_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js backend ─────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # image: gregzone/snip-backend:latest  
    container_name: snip_backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BASE_URL: ${BASE_URL}

    ports:
      - "5000:5000"
      
    depends_on:
      db:
        condition: service_healthy
    
volumes:
  pgdata:
    driver: local
